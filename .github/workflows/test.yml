name: Run Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20.16
        uses: actions/setup-node@v4
        with:
          node-version: "20.16.x"
      - name: Install dependencies
        run: yarn install